# =============================================================================
# LOGSTASH PIPELINE CONFIGURATION
# =============================================================================
#
# A Logstash pipeline has 3 sections:
#   input  → WHERE do logs come from?
#   filter → HOW do we parse/transform them?
#   output → WHERE do we send them?
#
# Our flow:
#   NestJS apps → TCP port 5000 → Logstash → Elasticsearch
#
# =============================================================================

input {
  # Listen for TCP connections on port 5000
  # Our NestJS services send structured JSON logs here via Winston TCP transport
  tcp {
    port => 5000
    codec => json_lines  # each line is a complete JSON object
  }
}

filter {
  # Parse the timestamp from our log message into Logstash's @timestamp field
  # This means logs appear in chronological order in Kibana, not ingestion order
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"  # Kibana uses @timestamp for time-based sorting
    }
  }

  # Add a computed field showing which environment we're in
  # Useful when you eventually have staging + production sending to same ES cluster
  mutate {
    add_field => { "environment" => "development" }
  }
}

output {
  # Send every log event to Elasticsearch
  # index name: logstash-YYYY.MM.DD (one index per day — standard ELK pattern)
  # In Kibana you'll create an index pattern "logstash-*" to match all daily indices
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "logstash-%{+YYYY.MM.dd}"
  }

  # Also print to Logstash console — useful for debugging the pipeline itself
  stdout {
    codec => rubydebug  # pretty-prints the parsed event structure
  }
}
